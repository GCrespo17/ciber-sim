<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ciber-sim — Simulación de Ciberseguridad</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <main>
    <!-- Login Screen -->
    <section id="login-screen">
      <h1>ciber-sim</h1>
      <p>Portal académico — Simulación educativa de ciberseguridad</p>
      <form id="login-form" autocomplete="off">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autocomplete="off">

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="off">

        <button type="submit">Ingresar</button>
        <p id="login-error" class="error" aria-live="polite"></p>
      </form>
    </section>

    <!-- Student Panel Shell -->
    <section id="student-panel" class="panel" hidden>
      <h2>Panel de Estudiante</h2>
      <p>Bienvenido, <span id="student-name"></span></p>
      <p><em>Panel de estudiante — contenido próximo (calificaciones, perfil).</em></p>
      <button id="logout-btn">Cerrar sesión</button>
    </section>

    <!-- Teacher Panel Shell -->
    <section id="teacher-panel" class="panel" hidden>
      <h2>Panel de Profesor</h2>
      <p>Bienvenido, <span id="teacher-name"></span></p>
      <p><em>Panel de profesor — contenido próximo (gestión de calificaciones, secciones).</em></p>
      <button id="logout-btn-teacher">Cerrar sesión</button>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
